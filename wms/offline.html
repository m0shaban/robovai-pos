<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Inventory Pro | Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #15314c, #08111f 58%);
        color: #f8fafc;
        font-family: Cairo, system-ui, sans-serif;
        padding: 24px;
      }

      .panel {
        width: min(100%, 460px);
        background: rgba(15, 23, 42, 0.84);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.6rem;
      }

      p {
        margin: 0 0 14px;
        color: #cbd5e1;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <section class="panel">
      <h1>أنت الآن بدون اتصال</h1>
      <p>
        التطبيق محفوظ محلياً ويمكنك المتابعة إذا سبق تحميله على هذا الجهاز. عند
        استعادة الاتصال، أعد فتح الصفحة للحصول على آخر إصدار.
      </p>
      <p>
        لأمان البيانات، استخدم النسخ الاحتياطي الدوري من داخل شاشة الإعدادات.
      </p>
    </section>
  </body>
</html>
